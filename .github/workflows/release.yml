name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal macOS build (Apple Silicon + Intel) → one dmg plus the
          # .app.tar.gz updater artifact tauri-action lists in latest.json.
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          # The AppImage self-updates (it is the Linux updater entry); the deb is
          # the AUR source artifact, updated through the package manager.
          - platform: ubuntu-22.04
            args: '--bundles deb,appimage'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags for the release notes

      # package.json is the single version source (tauri.conf.json points at it).
      - name: Verify the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(jq -r .version package.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in package.json" >&2
            exit 1
          fi

      # Group the conventional-commit subjects since the previous tag. Plain
      # text, no markdown headings: the About page shows the notes verbatim.
      - name: Write release notes
        id: notes
        run: |
          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          range=${prev:+$prev..}HEAD
          section() {
            lines=$(git log --format=%s "$range" | grep -E "^$2(\(|:)" | sed 's/^/- /')
            if [ -n "$lines" ]; then printf '%s\n%s\n\n' "$1" "$lines"; fi
          }
          {
            echo 'body<<EOF'
            section Features feat
            section Fixes fix
            section Performance perf
            if [ -n "$prev" ]; then echo "Full changelog: https://github.com/$GITHUB_REPOSITORY/compare/$prev...$GITHUB_REF_NAME"; fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # tauri-action runs the CLI directly, so the gitignored icon set
      # (regenerated from src-tauri/icons/app-icon.svg) must be built here.
      - name: Generate icons
        run: bun run generate-icons

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Spendo v__VERSION__'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload the deb for the AUR job
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v7
        with:
          name: linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  aur:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: linux-deb
          path: dist

      - name: Generate PKGBUILD
        run: |
          version=$(jq -r .version package.json)
          sha=$(sha256sum dist/*.deb | cut -d' ' -f1)
          sed -e "s/__VERSION__/$version/" -e "s/__SHA256__/$sha/" \
            packaging/aur/PKGBUILD.in > PKGBUILD

      - name: Publish to the AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: spendo-bin
          pkgbuild: ./PKGBUILD
          assets: ./packaging/aur/spendo-bin.install
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: 'Update to ${{ github.ref_name }}'
